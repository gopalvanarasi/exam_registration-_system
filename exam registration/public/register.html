<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration | ExamPortal</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="/">Exam<span>Portal</span></a><main class="auth-card wide"><p class="eyebrow">STUDENT ACCOUNT</p><h1>Create account</h1><p class="muted">Enter your academic details to get started.</p>
<form id="registerForm" class="form-grid"><label>Full name<input name="name" required></label><label>College email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Roll number<input name="rollNo" required></label><label>Course<input name="course" placeholder="e.g. AIML" required></label><label>Semester<input name="semester" type="number" min="1" max="12" required></label><label class="span-two">Phone number (optional)<input name="phone" type="tel"></label><button class="button full span-two">Create student account</button><p id="message" class="message span-two"></p></form>
<p class="muted center">Already registered? <a href="/login.html">Sign in</a></p></main><script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
